name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, rate-table and UI tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check GitHub Pages base path
        run: grep -q '/VA-Disability-Calculator/assets/' dist/index.html
