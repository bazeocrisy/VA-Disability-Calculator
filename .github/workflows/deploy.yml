name: Deploy to GitHub Pages

# Release gate (CLAUDE.md): deployment is MANUAL ONLY, from `main` only, and only when
# docs/audit.md contains exactly one valid approval record naming the reviewer entered here:
#
#   APPROVED FOR RELEASE — Reviewer: <full name> — Date: YYYY-MM-DD
#
# The rules are enforced by scripts/release-approval.mjs (unit-tested in
# src/test/release-approval.test.ts). For a second, human gate, add required reviewers to the
# `github-pages` environment in Settings → Environments.
on:
  workflow_dispatch:
    inputs:
      reviewer:
        description: 'Reviewer name exactly as written in the docs/audit.md approval record'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main (this run is on $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require a matching release approval
        env:
          REVIEWER: ${{ inputs.reviewer }}
        run: node scripts/release-approval.mjs docs/audit.md "$REVIEWER"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
